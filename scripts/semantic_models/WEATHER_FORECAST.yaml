verified_queries:
  - name: 天気データのある都市一覧
    question: 天気データがある都市の一覧を教えてください
    sql: |-
      SELECT
        DISTINCT city_name,
        admin_code,
        country_code,
        MIN(date) AS earliest_date,
        MAX(date) AS latest_date
      FROM
        city_daily_imperial
      GROUP BY
        city_name,
        admin_code,
        country_code
      ORDER BY
        city_name,
        admin_code,
        country_code
    use_as_onboarding_question: false
    verified_by: Admin
    verified_at: 1759763221
  - name: 東京の今週の天気予報
    question: 東京の今週の天気予報を教えてください
    sql: |-
      SELECT
        date,
        city_name,
        temperature_max,
        temperature_min,
        precipitation_probability,
        phrase_short
      FROM
        city_daily_imperial
      WHERE
        city_name = 'Tokyo'
        AND day_flag = 'D'
        AND date BETWEEN CURRENT_DATE AND DATEADD(DAY, 7, CURRENT_DATE)
      ORDER BY
        date
    use_as_onboarding_question: true
    verified_by: Admin
    verified_at: 1759763300
  - name: 降水確率が高い都市
    question: 明日の降水確率が50%以上の都市はどこですか？
    sql: |-
      SELECT
        city_name,
        date,
        precipitation_probability,
        phrase_short
      FROM
        city_daily_imperial
      WHERE
        day_flag = 'D'
        AND date = DATEADD(DAY, 1, CURRENT_DATE)
        AND precipitation_probability >= 50
      ORDER BY
        precipitation_probability DESC
    use_as_onboarding_question: true
    verified_by: Admin
    verified_at: 1759763400