name: WEATHER_FORECAST
description: このセマンティックビューは、日本国内の都市の天気予報データを含んでいます。日次テーブルで提供されます。
tables:
  - name: CITY_DAILY_IMPERIAL
    base_table:
      database: SUPPLY_CHAIN_ASSISTANT_DB
      schema: WEATHER
      table: CITY_DAILY_IMPERIAL
    dimensions:
      - name: ADMIN_CODE
        description: 都道府県コード
        expr: ADMIN_CODE
        data_type: VARCHAR(10)
        sample_values:
          - '13'
          - '27'
          - '23'
      - name: CITY_NAME
        description: 都市名
        expr: CITY_NAME
        data_type: VARCHAR(100)
        sample_values:
          - Tokyo
          - Osaka
          - Nagoya
      - name: COUNTRY_CODE
        description: 国コード
        expr: COUNTRY_CODE
        data_type: VARCHAR(2)
        sample_values:
          - JP
      - name: DAY_FLAG
        description: 昼間(D)または夜間(N)を示すフラグ
        expr: DAY_FLAG
        data_type: VARCHAR(1)
        sample_values:
          - 'N'
          - D
    time_dimensions:
      - name: DATE
        description: 天気予報の日付
        expr: DATE
        data_type: DATE
        sample_values:
          - '2022-11-05'
    facts:
      - name: ALLERGY_GRASS_24HR_MAX
        description: 24時間の芝花粉アレルギー最大レベル
        expr: ALLERGY_GRASS_24HR_MAX
        data_type: NUMBER(38,0)
        access_modifier: public_access
        sample_values:
          - '0'
          - '21'
      - name: ALLERGY_MOLD_24HR_MAX
        description: 24時間のカビ胞子の最大量
        expr: ALLERGY_MOLD_24HR_MAX
        data_type: NUMBER(38,0)
        access_modifier: public_access
        sample_values:
          - '149'
          - '3575'
          - '399'
      - name: ALLERGY_RAGWEED_24HR_MAX
        description: 24時間のブタクサ花粉アレルギー最大レベル
        expr: ALLERGY_RAGWEED_24HR_MAX
        data_type: NUMBER(38,0)
        access_modifier: public_access
        sample_values:
          - '6'
          - '0'
      - name: ALLERGY_TREE_24HR_MAX
        description: 24時間の樹木花粉の最大数
        expr: ALLERGY_TREE_24HR_MAX
        data_type: NUMBER(38,0)
        access_modifier: public_access
        sample_values:
          - '0'
      - name: CLOUD_COVER_AVG
        description: 平均雲量（%）
        expr: CLOUD_COVER_AVG
        data_type: NUMBER(38,0)
        access_modifier: public_access
        sample_values:
          - '36'
          - '91'
          - '93'
      - name: EVAPOTRANSPIRATION_LWE_TOTAL
        description: 蒸発散による水分損失量
        expr: EVAPOTRANSPIRATION_LWE_TOTAL
        data_type: NUMBER(5,2)
        access_modifier: public_access
        sample_values:
          - '0.07'
          - '0.01'
          - '0.02'
      - name: HAS_PRECIPITATION
        description: 降水の有無
        expr: HAS_PRECIPITATION
        data_type: BOOLEAN
        access_modifier: public_access
        sample_values:
          - 'TRUE'
          - 'FALSE'
      - name: ICE_LWE_TOTAL
        description: 氷の総蓄積量（インチ）
        expr: ICE_LWE_TOTAL
        data_type: NUMBER(8,5)
        access_modifier: public_access
