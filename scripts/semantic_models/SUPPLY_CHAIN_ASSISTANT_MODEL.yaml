name: SUPPLY_CHAIN_ASSISTANT_MODEL
tables:
  - name: SUPPLIERS
    base_table:
      database: SUPPLY_CHAIN_ASSISTANT_DB
      schema: ENTITIES
      table: SUPPLIERS
    dimensions:
      - name: ADDRESS
        synonyms:
          - location
          - street_address
          - supplier_location
          - vendor_address
        description: Street address of the supplier
        expr: ADDRESS
        data_type: VARCHAR(255)
        sample_values:
          - 1200 Aviation Blvd
          - 4500 Industrial Way
          - 800 Composite Dr
      - name: BUSINESS_LINE
        synonyms:
          - business_unit
          - company_segment
          - department
          - division
          - industry_sector
          - organization_unit
          - product_line
        description: 事業ライン (AUTOMOTIVE, ELECTRONICS, CONSTRUCTION, ENERGY, TEXTILE)
        expr: BUSINESS_LINE
        data_type: VARCHAR(15)
        sample_values:
          - AUTOMOTIVE
          - ELECTRONICS
          - CONSTRUCTION
          - ENERGY
          - TEXTILE
      - name: CITY
        synonyms:
          - municipality
          - supplier_city
          - town
          - vendor_city
        description: サプライヤーの所在都市
        expr: CITY
        data_type: VARCHAR(100)
        sample_values:
          - 刈谷市
          - 長岡京市
          - 港区
      - name: CONTACT_PERSON_NAME
        synonyms:
          - contact_name
          - supplier_contact
          - vendor_contact
        description: サプライヤーの担当者名
        expr: CONTACT_PERSON_NAME
        data_type: VARCHAR(255)
        sample_values:
          - 田中太郎
          - 鈴木一郎
          - 佐藤花子
      - name: COUNTRY
        synonyms:
          - nation
          - supplier_country
          - vendor_country
        description: サプライヤーの国
        expr: COUNTRY
        data_type: VARCHAR(50)
        sample_values:
          - JPN
      - name: IS_PREFERRED
        synonyms:
          - is_preferred_vendor
          - preferred_status
          - preferred_vendor
        description: Indicates if this is a preferred supplier
        expr: IS_PREFERRED
        data_type: BOOLEAN
        sample_values:
          - 'TRUE'
          - 'FALSE'
      - name: STATE
        synonyms:
          - province
          - supplier_state
          - vendor_state
        description: State/Province of the supplier
        expr: STATE
        data_type: VARCHAR(50)
        sample_values:
          - 愛知県
          - 京都府
          - 東京都
      - name: SUPPLIER_ID
        synonyms:
          - supplier_key
          - supplier_number
          - vendor_id
          - vendor_number
        description: Unique identifier for the supplier
        expr: SUPPLIER_ID
        data_type: INTEGER
        sample_values:
          - '9001'
          - '9002'
          - '9003'
      - name: SUPPLIER_NAME
        synonyms:
          - supplier_business_name
          - supplier_company
          - vendor_company
          - vendor_name
        description: Name of the supplier company
        expr: SUPPLIER_NAME
        data_type: VARCHAR(255)
        sample_values:
          - デンソー
          - 村田製作所
          - 東レ
      - name: SUPPLIER_TYPE
        synonyms:
          - supplier_category
          - vendor_category
          - vendor_type
        description: Type of supplier (Raw Materials, Components, Services, etc.)
        expr: SUPPLIER_TYPE
        data_type: VARCHAR(100)
        sample_values:
          - Raw Materials
          - Components
          - Services
    primary_key:
      columns:
        - SUPPLIER_ID
  - name: BILL_OF_MATERIALS
    base_table:
      database: SUPPLY_CHAIN_ASSISTANT_DB
      schema: ENTITIES
      table: BILL_OF_MATERIALS
    dimensions:
      - name: BOM_ID
        synonyms:
          - bill_of_materials_id
          - bom_key
          - bom_number
        description: Unique identifier for the bill of materials entry
        expr: BOM_ID
        data_type: INTEGER
        sample_values:
          - '10001'
          - '10002'
          - '10003'
      - name: CHILD_COMPONENT_ID
        synonyms:
          - child_part_id
          - component_id
          - required_component_id
        description: Component used in this BOM
        expr: CHILD_COMPONENT_ID
        data_type: INTEGER
        sample_values:
          - '1001'
          - '1002'
          - '1003'
      - name: CHILD_MATERIAL_ID
        synonyms:
          - material_id
          - raw_material_id
          - required_material_id
        description: Raw material used in this BOM
        expr: CHILD_MATERIAL_ID
        data_type: INTEGER
        sample_values:
          - '101'
          - '102'
          - '103'
      - name: PARENT_COMPONENT_ID
        synonyms:
          - component_id
          - parent_assembly_id
          - sub_assembly_id
        description: Component that uses these materials (for sub-assemblies)
        expr: PARENT_COMPONENT_ID
        data_type: INTEGER
        sample_values:
          - '1001'
          - '1002'
          - '1003'
      - name: PARENT_PRODUCT_ID
        synonyms:
          - finished_product_id
          - parent_item_id
          - product_id
        description: Product that uses these materials/components
        expr: PARENT_PRODUCT_ID
        data_type: INTEGER
        sample_values:
          - '5001'
          - '5002'
          - '5003'
      - name: UNIT_OF_MEASURE
        synonyms:
          - measurement_unit
          - unit
          - uom
        description: Unit of measure (pieces, kg, meters, etc.)
        expr: UNIT_OF_MEASURE
        data_type: VARCHAR(50)
        sample_values:
          - pieces
          - kg
          - m2
          - m
    time_dimensions:
      - name: EFFECTIVE_DATE
        synonyms:
          - activation_date
          - start_date
          - valid_from_date
        description: Date when this BOM version becomes effective
        expr: EFFECTIVE_DATE
        data_type: DATE
        sample_values:
          - '2024-01-01'
    facts:
      - name: QUANTITY_REQUIRED
        synonyms:
          - quantity_per_unit
          - required_quantity
          - usage_quantity
        description: Quantity of the child item required per parent item
        expr: QUANTITY_REQUIRED
        data_type: NUMBER(10,4)
        sample_values:
          - '2.5000'
          - '1.2000'
          - '3.8000'
      - name: SCRAP_FACTOR
        synonyms:
          - loss_factor
          - scrap_percentage
          - waste_factor
        description: Expected scrap/waste factor (0.05 = 5% scrap)
        expr: SCRAP_FACTOR
        data_type: NUMBER(5,4)
        sample_values:
          - '0.0500'
          - '0.0300'
          - '0.0200'
    primary_key:
      columns:
        - BOM_ID
  - name: MFG_PLANT
    base_table:
