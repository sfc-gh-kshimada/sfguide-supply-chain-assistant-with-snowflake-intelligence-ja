        expr: CITY
        data_type: VARCHAR(100)
        sample_values:
          - 豊田市
          - 品川区
          - 四日市市
      - name: COUNTRY
        synonyms:
          - geographical_area
          - homeland
          - land
          - nation
          - nationality
          - region
          - state
          - territory
        description: Country of the facility
        expr: COUNTRY
        data_type: VARCHAR(50)
        sample_values:
          - JPN
      - name: IS_ACTIVE
        synonyms:
          - active_status
          - current_status
