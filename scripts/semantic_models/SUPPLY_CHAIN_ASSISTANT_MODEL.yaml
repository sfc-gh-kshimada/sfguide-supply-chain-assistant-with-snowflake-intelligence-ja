        description: Unique identifier for the Manufacturing Plant
        expr: MFG_PLANT_ID
        data_type: INTEGER
        sample_values:
          - '1001'
          - '1002'
          - '1003'
      - name: MFG_PLANT_NAME
        synonyms:
          - facility_name
          - plant_name
        description: Name of the Manufacturing Plant
        expr: MFG_PLANT_NAME
        data_type: VARCHAR(255)
        sample_values:
          - 豊田自動車部品工場
          - 品川エレクトロニクス工場
          - 四日市繊維工場
      - name: STATE
        synonyms:
          - administrative_area
          - county
          - geographic_area
          - locality
          - prefecture
          - province
        description: State/Province of the facility
        expr: STATE
        data_type: VARCHAR(50)
        sample_values:
          - 愛知県
          - 東京都
          - 三重県
      - name: ZIP_CODE
        synonyms:
          - geographic_code
          - mailing_code
          - postal
          - postal_code
          - postcode
          - zip
        description: 工場の郵便番号
        expr: ZIP_CODE
        data_type: VARCHAR(20)
        sample_values:
          - '471-8571'
          - '108-0075'
          - '510-8527'
    facts:
      - name: LATITUDE
        synonyms:
          - geographic_latitude
          - lat
          - latitude_coordinate
          - latitude_position
          - latitude_value
        description: Latitude coordinate of the facility
        expr: LATITUDE
        data_type: NUMBER(10,6)
        sample_values:
          - '33.4484'
          - '47.6062'
          - '37.6922'
      - name: LONGITUDE
        synonyms:
          - east_west_coordinate
          - easting
          - geographic_longitude
          - longitudinal_coordinate
          - meridian_coordinate
        description: Longitude coordinate of the facility
        expr: LONGITUDE
        data_type: NUMBER(11,6)
        sample_values:
          - '-112.0740'
          - '-122.3321'
          - '-97.3375'
      - name: NUMBER_OF_EMPLOYEES
        synonyms:
          - employee_count
          - headcount
          - staff_size
          - workforce
        description: Number of employees at the manufacturing plant
        expr: NUMBER_OF_EMPLOYEES
        data_type: NUMBER(38,0)
        sample_values:
          - '850'
          - '625'
          - '945'
      - name: SQUARE_FOOTAGE
        synonyms:
          - building_area
          - facility_size
          - floor_space
          - plant_area
        description: Total square footage of the manufacturing plant
        expr: SQUARE_FOOTAGE
        data_type: NUMBER(10,2)
        sample_values:
          - '450000.00'
          - '380000.00'
          - '520000.00'
    primary_key:
      columns:
        - MFG_PLANT_ID
